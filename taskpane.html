<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=Edge">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Formula Explorer</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<link rel="stylesheet" href="taskpane.css?v=5">
</head>
<body>
  <main>
    <div class="top">
      <strong>Formula Explorer</strong>
      <span id="position">Select a formula cell</span>
    </div>
    <div id="formula" class="formula">Select a formula cell, then press ⌥⌘K or ⌥⌘J.</div>
    <div class="controls">
      <button id="left">← J</button>
      <button id="right">K →</button>
      <button id="exit">Exit here</button>
    </div>
    <div id="status" class="status">Original formula is part of the cycle. Exit here ends tracing and keeps the current selection. Enter/Esc also exits if the pane has focus.</div>
  </main>
<script src="taskpane.js?v=5"></script>
</body>
</html>
